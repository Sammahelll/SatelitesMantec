<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Alineación Láser — TKSA 41</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./sat-sync.js"></script>
<style>
  :root{
    --bg:#07090f;
    --panel:#0d1117;
    --ink:#cdd9f0;
    --muted:#5e7a9a;
    --accent:#3b82f6;
    --accent-dark:#60a5fa;
    --accent-soft:rgba(59,130,246,.12);
    --amber:#f0b429;
    --amber-soft:rgba(240,180,41,.12);
    --red:#ef4444;
    --red-soft:rgba(239,68,68,.12);
    --green:#10c98a;
    --green-soft:rgba(16,201,138,.12);
    --border:#1e2d45;
    --border2:#263548;
    --card:#111827;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;}
  header{
    background:var(--panel);
    border-bottom:1px solid var(--border);
    padding:18px 28px 0;
  }
  header h1{
    margin:0 0 2px;
    font-size:20px;
    font-weight:650;
    letter-spacing:-0.01em;
  }
  header .sub{
    color:var(--muted);
    font-size:13px;
    margin-bottom:14px;
  }
  nav{display:flex; gap:4px;}
  nav button{
    background:none;
    border:none;
    padding:10px 16px;
    font-size:14px;
    color:var(--muted);
    cursor:pointer;
    border-bottom:2px solid transparent;
    font-weight:500;
  }
  nav button.active{
    color:var(--accent-dark);
    border-bottom-color:var(--accent);
  }
  main{max-width:1100px; margin:0 auto; padding:24px 28px 80px;}
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:20px;
    margin-bottom:20px;
  }
  .panel h2{margin:0 0 14px; font-size:16px; font-weight:650;}
  .row{display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
  label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px; font-weight:500;}
  input, select, textarea{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:6px;
    font-size:14px;
    background:var(--card);
    color:var(--ink);
    font-family:inherit;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .field{margin-bottom:12px;}
  fieldset{border:1px solid var(--border); border-radius:6px; padding:14px; margin:0 0 16px;}
  fieldset legend{font-size:13px; font-weight:600; color:var(--accent-dark); padding:0 4px;}
  button.btn{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:9px 16px;
    border-radius:6px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  button.btn:hover{background:var(--accent-dark);}
  button.btn.secondary{
    background:none;
    color:var(--accent-dark);
    border:1px solid var(--accent);
  }
  button.btn.secondary:hover{background:var(--accent-soft);}
  button.btn.ghost{
    background:none;
    border:1px solid var(--border);
    color:var(--muted);
  }
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{
    text-align:left;
    padding:8px 10px;
    color:var(--muted);
    font-weight:600;
    font-size:12px;
    text-transform:none;
    border-bottom:1px solid var(--border);
  }
  td{padding:9px 10px; border-bottom:1px solid var(--border);}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:var(--card);}
  .badge{
    display:inline-block;
    padding:3px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:650;
  }
  .badge.verde{background:var(--green-soft); color:var(--green);}
  .badge.amarillo{background:var(--amber-soft); color:var(--amber);}
  .badge.rojo{background:var(--red-soft); color:var(--red);}
  .badge.neutro{background:var(--card); color:var(--muted);}
  .flag{
    display:flex; gap:8px; align-items:flex-start;
    padding:10px 12px; border-radius:6px; font-size:13.5px; margin-bottom:8px;
  }
  .flag.warn{background:var(--amber-soft); color:var(--amber);}
  .flag.danger{background:var(--red-soft); color:var(--red);}
  .flag.ok{background:var(--green-soft); color:var(--green);}
  .empty{color:var(--muted); font-size:13.5px; padding:20px; text-align:center;}
  .hidden{display:none !important;}
  .count-pill{
    display:inline-block; min-width:18px; padding:1px 6px; margin-left:6px;
    border-radius:20px; background:var(--red); color:#fff; font-size:11px;
    font-weight:700; text-align:center; line-height:1.5;
  }
  .capturas-item{
    border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--border2); border-radius:10px; max-width:640px; width:100%;
    max-height:88vh; overflow-y:auto; padding:24px;
  }
  .modal h3{margin:0 0 4px; font-size:18px;}
  .modal .close-row{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
  .kv{display:grid; grid-template-columns:150px 1fr; gap:6px 12px; font-size:13.5px; margin-bottom:4px;}
  .kv .k{color:var(--muted);}
  .compare{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:14px 0;}
  .compare .col{border:1px solid var(--border); border-radius:6px; padding:12px;}
  .compare .col h4{margin:0 0 8px; font-size:13px; color:var(--muted); text-transform:none;}
  canvas{width:100%; height:140px; display:block;}
  .stat{font-size:22px; font-weight:700; font-family:ui-monospace,SFMono-Regular,Consolas,monospace;}
  .stat-label{font-size:12px; color:var(--muted);}
  @media print{
    header, nav, .no-print{display:none !important;}
    body{background:#fff;}
    main{padding:0; max-width:none;}
    .panel{border:none; padding:0;}
  }

  /* ── MOBILE ── */
  @media (max-width:680px){
    header{padding:14px 16px 0;}
    nav{overflow-x:auto;}
    main{padding:16px 16px 60px;}
    .panel{padding:14px;}
    .grid2, .grid4{grid-template-columns:1fr;}
    .compare{grid-template-columns:1fr;}
    .kv{grid-template-columns:1fr; gap:0 12px;}
    .kv .k{margin-top:6px;}

    .modal-overlay{padding:0; align-items:stretch;}
    .modal{max-width:100%; width:100%; max-height:100vh; height:100%; border-radius:0;}

    /* Tablas -> tarjetas */
    table{width:100%;}
    table thead{display:none;}
    table tbody tr{
      display:block; margin-bottom:10px; border:1px solid var(--border);
      border-radius:8px; padding:6px 12px; background:var(--card);
    }
    table tbody td{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:7px 0; border-bottom:1px solid var(--border); text-align:right !important;
    }
    table tbody td:last-child{border-bottom:none;}
    table tbody td::before{
      content:attr(data-label); font-size:12px; color:var(--muted); font-weight:600;
      text-align:left;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Seguimiento de Alineación Láser</h1>
  <div class="sub">Registro de intervenciones · SKF TKSA 41</div>
  <nav id="tabNav">
    <button data-tab="equipos" class="active">Equipos</button>
    <button data-tab="nueva">Registrar alineación</button>
  </nav>
  <div class="row" style="padding:0 0 12px;">
    <button class="btn secondary" onclick="abrirCapturasPendientes()">📥 Capturas de campo<span id="capturasBadge" class="count-pill hidden">0</span></button>
  </div>
</header>

<main id="mainArea"></main>

<div id="modalRoot"></div>

<script>
// ═══════════════════════════════════════════════════════════
//  1. DATOS Y PERSISTENCIA
// ═══════════════════════════════════════════════════════════
const STORAGE_KEY = 'alineacion_laser_data_v1';

let equiposRegistry = new Map();   // id -> {tag, planta, tipoAcople, rpm, tempTrabajo}
let alineaciones = new Map();      // equipoId -> [ {id, fecha, tecnico, motivo, asFound, asLeft, semaforo, pataBlanda, observaciones, proximaRevision} ]
let equiposHub = new Map();        // tag -> {nombre, tipo, ubicacion} — catálogo compartido del hub
let _capturasPendientes = [];      // capturas crudas desde el Hub de Campo, sin procesar
let _capturaActual = null;         // captura en edición dentro del form "Registrar alineación"
let _avisoCaptura = null;          // TAG mostrado en el aviso "copiado desde el hub"
let _detalleEquipoId = null;       // equipo mostrado en la pestaña "detalle" (antes era window._detalleEquipoId)

function genId(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function saveData(){
  const data = {
    equipos: Array.from(equiposRegistry.entries()),
    alineaciones: Array.from(alineaciones.entries())
  };
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){ console.error('No se pudo guardar', e); }
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    equiposRegistry = new Map(data.equipos || []);
    alineaciones = new Map(data.alineaciones || []);
  }catch(e){ console.error('No se pudo cargar', e); }
}

// ═══════════════════════════════════════════════════════════
//  2. UTILIDADES
// ═══════════════════════════════════════════════════════════
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function fmtNum(n, dec=2){
  if(n === null || n === undefined || n === '' || isNaN(n)) return '—';
  return Number(n).toFixed(dec);
}
function daysBetween(a,b){
  return Math.abs((new Date(a) - new Date(b)) / (1000*60*60*24));
}
function offsetMagnitud(v){
  if(!v) return NaN;
  const ov = parseFloat(v.offV), oh = parseFloat(v.offH);
  if(isNaN(ov) && isNaN(oh)) return NaN;
  return Math.sqrt((ov||0)**2 + (oh||0)**2);
}
function semaforoBadge(s){
  const val = (s||'').toLowerCase();
  const label = val === 'verde' ? 'Verde' : val === 'amarillo' ? 'Amarillo' : val === 'rojo' ? 'Rojo' : '—';
  const cls = ['verde','amarillo','rojo'].includes(val) ? val : 'neutro';
  return `<span class="badge ${cls}">${label}</span>`;
}
function sortedHistorial(equipoId){
  const list = alineaciones.get(equipoId) || [];
  return [...list].sort((a,b) => new Date(a.fecha) - new Date(b.fecha));
}

// ═══════════════════════════════════════════════════════════
//  3. MOTOR DE DIAGNÓSTICO
//  No recalcula tolerancias (eso ya lo hace el TKSA 41 en pantalla,
//  según la norma/OEM que corresponda a cada máquina). Lo que hace
//  es leer el patrón histórico: recidiva, tendencia y vencimiento
//  de la próxima revisión.
// ═══════════════════════════════════════════════════════════
function diagnosticarEquipo(equipoId){
  const hist = sortedHistorial(equipoId);
  const flags = [];
  if(hist.length === 0) return { flags, ultimo:null, tendencia:null };

  const ultimo = hist[hist.length - 1];

  // Recidiva: 2+ intervenciones con semáforo no-verde dentro de una ventana de 6 meses
  let recidivas = 0;
  for(let i=1;i<hist.length;i++){
    const prevNoVerde = (hist[i-1].semaforo||'').toLowerCase() !== 'verde';
    const actualNoVerde = (hist[i].semaforo||'').toLowerCase() !== 'verde';
    if(actualNoVerde && daysBetween(hist[i].fecha, hist[i-1].fecha) <= 183){
      recidivas++;
    }
  }
  if(recidivas > 0){
    flags.push({level:'warn', text: `Este equipo tuvo ${recidivas} reincidencia(s): volvió a salir de tolerancia dentro de los 6 meses de una alineación previa. Puede indicar un problema estructural (base, pata blanda recurrente, tensión de tuberías) en vez de solo desgaste normal.`});
  }

  // Tendencia: comparar magnitud de offset as-left de las últimas 3 intervenciones
  const ultimas = hist.slice(-3).map(h => offsetMagnitud(h.asLeft)).filter(v => !isNaN(v));
  if(ultimas.length >= 2){
    const creciendo = ultimas.every((v,i) => i===0 || v >= ultimas[i-1]);
    const primero = ultimas[0], last = ultimas[ultimas.length-1];
    if(creciendo && last > primero * 1.15){
      flags.push({level:'warn', text:`El offset final (as-left) viene en aumento en las últimas intervenciones (${fmtNum(primero)} → ${fmtNum(last)} mm), aunque cada cierre haya quedado en tolerancia. Vale la pena revisar desgaste de acople o asentamiento de base.`});
    }
  }

  // Próxima revisión
  if(ultimo.proximaRevision){
    const hoy = new Date();
    const prox = new Date(ultimo.proximaRevision + 'T00:00:00');
    const diff = Math.round((prox - hoy)/(1000*60*60*24));
    if(diff < 0){
      flags.push({level:'danger', text:`La próxima revisión programada (${fmtDate(ultimo.proximaRevision)}) ya venció hace ${Math.abs(diff)} día(s).`});
    } else if(diff <= 14){
      flags.push({level:'warn', text:`Próxima revisión programada en ${diff} día(s) (${fmtDate(ultimo.proximaRevision)}).`});
    }
  }

  if(flags.length === 0){
    flags.push({level:'ok', text:'Sin alertas de recidiva ni de tendencia con el historial actual.'});
  }

  return { flags, ultimo, tendencia: ultimas };
}

// ═══════════════════════════════════════════════════════════
//  4. RENDER — TABS
// ═══════════════════════════════════════════════════════════
let currentTab = 'equipos';

let _formSnapshot = null;         // valores del form "nueva" al salir por accidente sin guardar
const NUEVA_FORM_FIELDS = ['fEquipo','fFecha','fTecnico','fMotivo','afOffV','afOffH','afAngV','afAngH',
  'alOffV','alOffH','alAngV','alAngH','fSemaforo','fPataDetectada','fPataDetalle','fObs','fProxima'];

function snapshotFormNueva(){
  const snap = {};
  for(const id of NUEVA_FORM_FIELDS){
    const el = document.getElementById(id);
    if(el) snap[id] = el.value;
  }
  return snap;
}
function restoreFormNueva(snap){
  for(const id of NUEVA_FORM_FIELDS){
    const el = document.getElementById(id);
    if(el && snap[id] !== undefined) el.value = snap[id];
  }
}

function switchTab(tab){
  // Antes esto borraba _avisoCaptura/_capturaActual (y con ellos, todo lo tipeado)
  // apenas se tocaba otro tab por error — en celular pasa todo el tiempo. Ahora
  // se guarda el estado del form y se restaura al volver a "nueva", en vez de
  // descartarlo. Solo se limpia al confirmar "Guardar alineación" (más abajo).
  if(currentTab === 'nueva' && tab !== 'nueva'){
    _formSnapshot = snapshotFormNueva();
  }
  currentTab = tab;
  document.querySelectorAll('#tabNav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  render();
  if(tab === 'nueva' && _formSnapshot){
    restoreFormNueva(_formSnapshot);
    _formSnapshot = null;
  }
}

function render(){
  const main = document.getElementById('mainArea');
  if(currentTab === 'equipos') main.innerHTML = renderEquiposTab();
  else if(currentTab === 'nueva') main.innerHTML = renderNuevaAlineacionTab();
  else if(currentTab === 'detalle') main.innerHTML = renderDetalleEquipo(_detalleEquipoId);
  wireEvents();
}

// ---- Tab: Equipos ----
function renderEquiposTab(){
  const rows = Array.from(equiposRegistry.entries());
  let body;
  if(rows.length === 0){
    body = `<div class="empty">Todavía no hay equipos registrados. Cargá el primero desde "Registrar alineación".</div>`;
  }else{
    body = `<table><thead><tr>
      <th>TAG</th><th>Planta</th><th>RPM</th><th>Acoplamiento</th><th>Alineaciones</th><th>Último resultado</th>
    </tr></thead><tbody>` +
    rows.map(([id, eq]) => {
      const hist = sortedHistorial(id);
      const ultimo = hist[hist.length-1];
      return `<tr class="clickable" data-open-equipo="${id}">
        <td class="mono" data-label="TAG">${escapeHtml(eq.tag)}</td>
        <td data-label="Planta">${escapeHtml(eq.planta||'—')}</td>
        <td class="mono" data-label="RPM">${eq.rpm||'—'}</td>
        <td data-label="Acoplamiento">${escapeHtml(eq.tipoAcople||'—')}</td>
        <td class="mono" data-label="Alineaciones">${hist.length}</td>
        <td data-label="Último resultado">${ultimo ? semaforoBadge(ultimo.semaforo) + ' <span class="mono" style="color:var(--muted); font-size:12px;">' + fmtDate(ultimo.fecha) + '</span>' : '—'}</td>
      </tr>`;
    }).join('') + `</tbody></table>`;
  }
  return `<div class="panel">
    <div class="row" style="justify-content:space-between; margin-bottom:14px;">
      <h2 style="margin:0;">Equipos</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn secondary" onclick="sincronizarYRenderEquipos()">🔄 Sincronizar equipos del hub</button>
        <button class="btn secondary" onclick="exportCSV()">⬇️ Exportar CSV</button>
        <button class="btn secondary" id="btnNuevoEquipo">+ Nuevo equipo</button>
      </div>
    </div>
    ${body}
  </div>`;
}

// ---- Tab: Registrar alineación ----
function renderNuevaAlineacionTab(){
  const nombresLocales = new Set(Array.from(equiposRegistry.values()).map(eq => (eq.tag||'').toUpperCase()));
  const opciones = Array.from(equiposRegistry.entries())
    .map(([id, eq]) => `<option value="${id}">${escapeHtml(eq.tag)} — ${escapeHtml(eq.planta||'')}</option>`).join('')
    + Array.from(equiposHub.entries())
      .filter(([tag]) => !nombresLocales.has(tag.toUpperCase()))
      .map(([tag, eq]) => `<option value="__hub:${escapeHtml(tag)}">☁ ${escapeHtml(tag)} — ${escapeHtml(eq.nombre||'')} (del hub)</option>`).join('');
  return `<div class="panel">
    <h2>Registrar alineación</h2>
    ${_avisoCaptura ? `<div class="flag ok">📋<div>Datos de <strong>${escapeHtml(_avisoCaptura)}</strong> copiados desde el Hub de Campo — revisá y confirmá con "Guardar alineación".</div></div>` : ''}
    <form id="formAlineacion">
      <div class="grid2">
        <div class="field">
          <label>Equipo</label>
          <select id="fEquipo" required>
            <option value="">Seleccionar...</option>
            ${opciones}
            <option value="__nuevo__">+ Nuevo equipo...</option>
          </select>
        </div>
        <div class="field">
          <label>Fecha</label>
          <input type="date" id="fFecha" required value="${new Date().toISOString().slice(0,10)}">
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>Técnico</label>
          <input type="text" id="fTecnico" placeholder="Nombre del responsable">
        </div>
        <div class="field">
          <label>Motivo de la intervención</label>
          <select id="fMotivo">
            <option value="preventivo">Preventivo / rutina</option>
            <option value="correctivo">Correctivo</option>
            <option value="instalacion">Instalación nueva</option>
            <option value="otro">Otro</option>
          </select>
        </div>
      </div>

      <fieldset>
        <legend>Como se encontró (as-found) — opcional</legend>
        <div class="grid4">
          <div class="field"><label>Offset vertical (mm)</label><input type="number" step="0.01" id="afOffV"></div>
          <div class="field"><label>Offset horizontal (mm)</label><input type="number" step="0.01" id="afOffH"></div>
          <div class="field"><label>Ángulo vertical (mm/100mm)</label><input type="number" step="0.01" id="afAngV"></div>
          <div class="field"><label>Ángulo horizontal (mm/100mm)</label><input type="number" step="0.01" id="afAngH"></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Como se dejó (as-left)</legend>
        <div class="grid4">
          <div class="field"><label>Offset vertical (mm)</label><input type="number" step="0.01" id="alOffV" required></div>
          <div class="field"><label>Offset horizontal (mm)</label><input type="number" step="0.01" id="alOffH" required></div>
          <div class="field"><label>Ángulo vertical (mm/100mm)</label><input type="number" step="0.01" id="alAngV"></div>
          <div class="field"><label>Ángulo horizontal (mm/100mm)</label><input type="number" step="0.01" id="alAngH"></div>
        </div>
        <div class="field" style="max-width:220px;">
          <label>Resultado del semáforo TKSA 41</label>
          <select id="fSemaforo" required>
            <option value="verde">Verde — excelente/conforme</option>
            <option value="amarillo">Amarillo — aceptable</option>
            <option value="rojo">Rojo — fuera de tolerancia</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>Pata blanda — opcional</legend>
        <div class="grid2">
          <div class="field">
            <label>¿Se detectó pata blanda?</label>
            <select id="fPataDetectada"><option value="no">No</option><option value="si">Sí</option></select>
          </div>
          <div class="field"><label>Valor máximo (mm) / pata afectada</label><input type="text" id="fPataDetalle" placeholder="ej: 0.12 mm, pata delantera derecha"></div>
        </div>
      </fieldset>

      <div class="grid2">

function drawTrend(equipoId){
  const canvas = document.getElementById('trendCanvas');
  if(!canvas) return;
  const hist = sortedHistorial(equipoId);
  const points = hist.map(h => ({date:h.fecha, mag:offsetMagnitud(h.asLeft)})).filter(p => !isNaN(p.mag));
  if(points.length < 2) return;

  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = 140;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);

  const pad = {l:34, r:14, t:14, b:22};
  const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;
  const maxVal = Math.max(...points.map(p=>p.mag), 0.01) * 1.15;

  // ejes
  ctx.strokeStyle = '#1e2d45';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad.l, pad.t); ctx.lineTo(pad.l, pad.t+plotH); ctx.lineTo(pad.l+plotW, pad.t+plotH);
  ctx.stroke();

  ctx.fillStyle = '#5e7a9a';
  ctx.font = '11px -apple-system, sans-serif';
  ctx.fillText(maxVal.toFixed(2)+' mm', 2, pad.t+6);
  ctx.fillText('0', 2, pad.t+plotH);

  // linea
  ctx.strokeStyle = '#3b82f6';
  ctx.lineWidth = 2;
  ctx.beginPath();
  points.forEach((p,i) => {
    const x = pad.l + (points.length===1 ? 0 : (i/(points.length-1))*plotW);
    const y = pad.t + plotH - (p.mag/maxVal)*plotH;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();

  points.forEach((p,i) => {
    const x = pad.l + (points.length===1 ? 0 : (i/(points.length-1))*plotW);
    const y = pad.t + plotH - (p.mag/maxVal)*plotH;
    ctx.fillStyle = '#60a5fa';
    ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5e7a9a';
    ctx.font = '10px -apple-system, sans-serif';
    const label = fmtDate(p.date).slice(0,5);
    ctx.fillText(label, x-12, h-4);
  });
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// El <select> de motivo guarda el código (preventivo/correctivo/instalacion/otro)
// para hablar el mismo idioma que el hub — esto lo traduce a etiqueta legible
// dondequiera que se muestre un registro guardado.
const MOTIVO_LABELS = { preventivo:'Preventivo / rutina', correctivo:'Correctivo', instalacion:'Instalación nueva', otro:'Otro' };
function motivoLabel(m){ return MOTIVO_LABELS[m] || m || '—'; }

function validarRangos(reglas){
  for(const [id, min, max, etiqueta] of reglas){
    const el = document.getElementById(id);
    if(!el || el.value === '') continue;
    const v = parseFloat(el.value);
    if(isNaN(v)) continue;
    if(v < min || v > max){
      alert(`⚠️ ${etiqueta}: ${v} está fuera de rango (${min}–${max}).`);
      el.focus();
      return false;
    }
  }
  return true;
}

function wireEvents(){
  document.querySelectorAll('[data-open-equipo]').forEach(el => {
    el.addEventListener('click', () => { _detalleEquipoId = el.dataset.openEquipo; currentTab='detalle'; render(); setTimeout(()=>drawTrend(el.dataset.openEquipo),0); });
  });
  const btnNuevoEquipo = document.getElementById('btnNuevoEquipo');
  if(btnNuevoEquipo) btnNuevoEquipo.onclick = () => openNuevoEquipoModal();

  const btnVolver = document.getElementById('btnVolverEquipos');
  if(btnVolver) btnVolver.onclick = () => switchTab('equipos');

  document.querySelectorAll('[data-open-informe]').forEach(el => {
    el.addEventListener('click', () => openInformeTrabajo(_detalleEquipoId, el.dataset.openInforme));
  });

  const fEquipo = document.getElementById('fEquipo');
  if(fEquipo) fEquipo.addEventListener('change', () => {
    if(fEquipo.value === '__nuevo__'){
      openNuevoEquipoModal((newId) => {
        render();
        setTimeout(() => { document.getElementById('fEquipo').value = newId; }, 0);
      });
    }
  });

  const form = document.getElementById('formAlineacion');
  if(form) form.addEventListener('submit', (e) => {
    e.preventDefault();
    let equipoId = document.getElementById('fEquipo').value;
    if(!equipoId || equipoId === '__nuevo__'){ document.getElementById('fEquipo').focus(); return; }
    if(equipoId.startsWith('__hub:')){
      // Equipo elegido del catálogo compartido: se crea el registro local
      // usando el TAG del hub, para mantener la misma identidad.
      const hubTag = equipoId.slice('__hub:'.length);
      const hubEq  = equiposHub.get(hubTag) || {};
      const yaExiste = Array.from(equiposRegistry.entries()).find(([,eq]) => (eq.tag||'').toUpperCase() === hubTag.toUpperCase());
      if(yaExiste){
        equipoId = yaExiste[0];
      }else{
        equipoId = genId();
        equiposRegistry.set(equipoId, { tag:hubTag, planta:hubEq.ubicacion||'', rpm:'', tipoAcople:'', tempTrabajo:'' });
      }
    }

    // Validación básica de rangos — no reemplaza el juicio del técnico, solo
    // atrapa errores de tipeo obvios (offsets/ángulos fuera de todo rango físico
    // razonable de una alineación láser) antes de guardar.
    if(!validarRangos([
      ['afOffV', -50, 50, 'Offset vertical (as-found)'],
      ['afOffH', -50, 50, 'Offset horizontal (as-found)'],
      ['afAngV', -50, 50, 'Ángulo vertical (as-found)'],
      ['afAngH', -50, 50, 'Ángulo horizontal (as-found)'],
      ['alOffV', -50, 50, 'Offset vertical (as-left)'],
      ['alOffH', -50, 50, 'Offset horizontal (as-left)'],
      ['alAngV', -50, 50, 'Ángulo vertical (as-left)'],
      ['alAngH', -50, 50, 'Ángulo horizontal (as-left)']
    ])) return;

    const registro = {
      id: genId(),
      fecha: document.getElementById('fFecha').value,
      tecnico: document.getElementById('fTecnico').value.trim(),
      motivo: document.getElementById('fMotivo').value,
      asFound: {
        offV: document.getElementById('afOffV').value,
        offH: document.getElementById('afOffH').value,
        angV: document.getElementById('afAngV').value,
        angH: document.getElementById('afAngH').value
      },
      asLeft: {
        offV: document.getElementById('alOffV').value,
        offH: document.getElementById('alOffH').value,
        angV: document.getElementById('alAngV').value,
        angH: document.getElementById('alAngH').value
      },
      semaforo: document.getElementById('fSemaforo').value,
      pataBlanda: {
        detectada: document.getElementById('fPataDetectada').value,
        detalle: document.getElementById('fPataDetalle').value.trim()
      },
      observaciones: document.getElementById('fObs').value.trim(),
      proximaRevision: document.getElementById('fProxima').value
    };

    if(!alineaciones.has(equipoId)) alineaciones.set(equipoId, []);
    alineaciones.get(equipoId).push(registro);
    saveData();
    guardarEnLaNube(registro, equiposRegistry.get(equipoId)); // asíncrono, no bloquea el registro local

    if(_capturaActual){
      const capId = _capturaActual.id;
      _capturaActual = null;
      if(typeof SatSync !== 'undefined' && SatSync.estaConfigurado()){
        SatSync.marcarCapturaProcesada(capId).catch(err=>console.warn('[SatSync] no se pudo marcar la captura como procesada', err));
      }
    }
    _avisoCaptura = null;

    _detalleEquipoId = equipoId;
    currentTab = 'detalle';
    render();
    setTimeout(()=>drawTrend(equipoId),0);
  });
}

async function abrirCapturasPendientes(){
  openModal(`
    <h3>📥 Capturas pendientes de campo</h3>
    <div style="color:var(--muted); font-size:13px; margin-bottom:14px;">Cargadas desde el Hub de Campo — sin guardar todavía</div>
    <div id="capturasLista"><div class="empty">📡 Buscando capturas pendientes…</div></div>
    <div class="close-row"><button class="btn ghost" id="mCloseCapturas">Cerrar</button></div>
  `);
  document.getElementById('mCloseCapturas').onclick = closeModal;

  const lista = document.getElementById('capturasLista');
  if(typeof SatSync === 'undefined' || !SatSync.init()){
    lista.innerHTML = `<div class="empty">⚠️ Sin conexión configurada. Abrí el hub (index.html) y conectá Supabase primero.</div>`;
    return;
  }
  try{
    _capturasPendientes = await SatSync.listarCapturasPendientes({ modulo: 'alineacion' });
  }catch(err){
    lista.innerHTML = `<div class="empty">⚠️ No se pudo leer capturas_campo: ${escapeHtml(err.message)}</div>`;
    return;
  }
  renderCapturasBadge();
  if(!_capturasPendientes.length){
    lista.innerHTML = `<div class="empty">✅ No hay capturas pendientes desde el Hub de Campo.</div>`;
    return;
  }
  lista.innerHTML = _capturasPendientes.map((c,i)=>{
    const d = c.datos || {};
    const tag = c.equipos?.tag || '(sin tag)';
    return `<div class="capturas-item">
      <div>
        <div style="font-weight:600;">${escapeHtml(tag)}</div>
        <div style="font-size:.75rem;color:var(--muted);">${escapeHtml(d.fecha||'')}${d.semaforo ? ' · ' + semaforoBadge(d.semaforo) : ''}${d.tecnico ? ' · '+escapeHtml(d.tecnico) : ''}</div>
      </div>
      <button class="btn secondary" onclick="copiarCapturaAFormulario(${i})">📋 Copiar a formulario</button>
    </div>`;
  }).join('');
}

function renderCapturasBadge(){
  const b = document.getElementById('capturasBadge');
  if(!b) return;
  b.textContent = _capturasPendientes.length;
  b.classList.toggle('hidden', _capturasPendientes.length===0);
}
// Chequea capturas pendientes sin abrir el modal — para que el badge avise
// apenas se carga la página, igual que en Motor Pro, Refrigeración Pro y Tablero Pro.
async function actualizarBadgeCapturas(){
  const b = document.getElementById('capturasBadge');
  if(!b) return;
  if(typeof SatSync === 'undefined' || !SatSync.init() || typeof SatSync.listarCapturasPendientes !== 'function'){
    b.classList.add('hidden');
    return;
  }
  try{
    _capturasPendientes = await SatSync.listarCapturasPendientes({ modulo: 'alineacion' });
    renderCapturasBadge();
  }catch(err){
    console.warn('[SatSync] no se pudo chequear capturas pendientes', err);
    b.classList.add('hidden');
  }
}

function copiarCapturaAFormulario(i){
  const captura = _capturasPendientes[i];
  if(!captura) return;
  const d = captura.datos || {};
  const tag = captura.equipos?.tag || '';
  closeModal();

  let equipoId = null;
  if(tag){
    for(const [id, eq] of equiposRegistry.entries()) if((eq.tag||'').toUpperCase() === tag.toUpperCase()){ equipoId = id; break; }
    if(!equipoId){
      equipoId = genId();
      equiposRegistry.set(equipoId, { tag, planta: captura.equipos?.ubicacion || '', rpm:'', tipoAcople:'', tempTrabajo:'' });
      publicarEquipoEnHub(tag, '');
      saveData();
    }
  }

  _avisoCaptura = tag || '(equipo sin tag)';
  currentTab = 'nueva';
  render();

  const fEquipo = document.getElementById('fEquipo');
  if(fEquipo && equipoId) fEquipo.value = equipoId;
  if(d.fecha) document.getElementById('fFecha').value = d.fecha;
  if(d.tecnico) document.getElementById('fTecnico').value = d.tecnico;
  if(d.motivo) document.getElementById('fMotivo').value = d.motivo;

  const af = d.asFound || {};
  if(af.offV!=null && af.offV!=='') document.getElementById('afOffV').value = af.offV;
  if(af.offH!=null && af.offH!=='') document.getElementById('afOffH').value = af.offH;
  if(af.angV!=null && af.angV!=='') document.getElementById('afAngV').value = af.angV;
  if(af.angH!=null && af.angH!=='') document.getElementById('afAngH').value = af.angH;

  const al = d.asLeft || {};
  if(al.offV!=null && al.offV!=='') document.getElementById('alOffV').value = al.offV;
  if(al.offH!=null && al.offH!=='') document.getElementById('alOffH').value = al.offH;
  if(al.angV!=null && al.angV!=='') document.getElementById('alAngV').value = al.angV;
  if(al.angH!=null && al.angH!=='') document.getElementById('alAngH').value = al.angH;

  if(d.semaforo) document.getElementById('fSemaforo').value = d.semaforo;

  const pb = d.pataBlanda || {};
  document.getElementById('fPataDetectada').value = pb.detectada || 'no';
  if(pb.detalle) document.getElementById('fPataDetalle').value = pb.detalle;

  if(d.observaciones) document.getElementById('fObs').value = d.observaciones;
  if(d.proximaRevision) document.getElementById('fProxima').value = d.proximaRevision;

  _capturaActual = captura; // se marca como procesada recién al confirmar "Guardar alineación"
}

//  SINCRONIZACIÓN CON EL HUB (SatSync)
// ═══════════════════════════════════════════════════════════
async function sincronizarEquiposHub(silencioso){
  if(typeof SatSync === 'undefined' || !SatSync.init()){
    if(!silencioso) alert('Conectá Supabase primero (configuralo desde el hub — index.html).');
    return false;
  }
  try{
    const rows = await SatSync.listarEquipos();
    equiposHub = new Map(rows.map(e => [e.tag, e]));
    return true;
  }catch(err){
    console.error('[SatSync] error sincronizando equipos', err);
    if(!silencioso) alert('No se pudo leer el catálogo de equipos del hub: ' + err.message);
    return false;
  }
}

async function publicarEquipoEnHub(name, tipo){
  if(typeof SatSync === 'undefined' || !SatSync.init()) return;
  try{
    await SatSync.buscarOCrearEquipo(name, {tipo});
    equiposHub.set(name, {tag:name, nombre:name, tipo});
  }catch(err){
    console.warn('[SatSync] no se pudo publicar el equipo en el hub', err);
  }
}

// El botón de "Sincronizar equipos del hub" no daba ninguna señal de éxito/error —
// esto da feedback explícito en los dos casos, en vez del silencio de antes.
async function sincronizarYRenderEquipos(){
  const ok = await sincronizarEquiposHub(false);

// Export CSV del historial de alineaciones — mismo criterio que Motor Pro,
// Refrigeración Pro y Tablero Pro.
function exportCSV(){
  if(!alineaciones.size){ alert('Sin datos para exportar.'); return; }
  let rows = ['TAG,Planta,Fecha,Tecnico,Motivo,Semaforo,OffV_AF,OffH_AF,AngV_AF,AngH_AF,OffV_AL,OffH_AL,AngV_AL,AngH_AL,PataBlanda,DetallePata,ProximaRevision,Observaciones'];
  for(const [eqId, list] of alineaciones.entries()){
    const eq = equiposRegistry.get(eqId) || {};
    for(const a of list){
      rows.push([
        `"${eq.tag||''}"`, `"${eq.planta||''}"`, a.fecha, `"${a.tecnico||''}"`, `"${motivoLabel(a.motivo)}"`,
        a.semaforo,
        a.asFound?.offV||'', a.asFound?.offH||'', a.asFound?.angV||'', a.asFound?.angH||'',
        a.asLeft?.offV||'', a.asLeft?.offH||'', a.asLeft?.angV||'', a.asLeft?.angH||'',
        a.pataBlanda?.detectada||'', `"${(a.pataBlanda?.detalle||'').replace(/"/g,'""')}"`,
        a.proximaRevision||'', `"${(a.observaciones||'').replace(/"/g,'""')}"`
      ].join(','));
    }
  }
  const blob = new Blob([rows.join('\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `alineacion_laser_historial_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

function mapSemaforoASeveridad(semaforo){
  if(semaforo === 'rojo') return 'critico';
  if(semaforo === 'amarillo') return 'atencion';
  return 'ok';
}

async function guardarEnLaNube(registro, equipo){
  if(typeof SatSync === 'undefined' || !SatSync.init()) return; // sin conexión configurada, sigue funcionando local
  const tag = equipo?.tag;
  if(!tag) return;
  try{
    await SatSync.guardarAnalisis({
      modulo: 'alineacion',
      equipo_tag: tag,
      severidad: mapSemaforoASeveridad(registro.semaforo),
      resumen: `Alineación (${registro.motivo}) — resultado ${registro.semaforo}` + (registro.pataBlanda?.detectada==='si' ? ' · pata blanda detectada' : ''),
      datos: registro
    });
  }catch(err){
    console.warn('[SatSync] no se pudo guardar la alineación en la nube', err);
  }
}
